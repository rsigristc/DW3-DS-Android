apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.digitaladventure.dw2003'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.digitaladventure.dw2003'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '0.7.15-poc'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-26', 'APP_ABI=arm64-v8a'
                abiFilters 'arm64-v8a'
            }
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    externalNativeBuild {
        ndkBuild {
            path file('../cores/pcsx_rearmed/jni/Android.mk')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'ChromeOsAbiSupport', 'IconLauncherShape'
    }
}

dependencies {
    implementation project(':libretrodroid')
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.window:window:1.5.1'
    implementation 'androidx.window:window-java:1.5.1'
    testImplementation 'junit:junit:4.13.2'
}

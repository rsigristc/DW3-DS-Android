apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.digitaladventure.dw2003.remote'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.digitaladventure.dw2003.remote'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.4.0'
    }

    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    def releaseStorePath = System.getenv('DW2003_STORE_FILE') ?: keystoreProps['storeFile']

    signingConfigs {
        release {
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
                storePassword System.getenv('DW2003_STORE_PASSWORD') ?: keystoreProps['storePassword']
                keyAlias System.getenv('DW2003_KEY_ALIAS') ?: keystoreProps['keyAlias']
                keyPassword System.getenv('DW2003_KEY_PASSWORD') ?: keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    sourceSets {
        main.res.srcDirs += '../app/src/main/res'
    }
}

dependencies {
    implementation project(':remote-protocol')
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'
}

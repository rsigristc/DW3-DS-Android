name: Android

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*-poc"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dw2003-dual-screen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DW2003-Dual-Screen-debug
          path: dw2003-dual-screen/app/build/outputs/apk/debug/app-debug.apk

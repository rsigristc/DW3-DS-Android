name: Publish Android release

on:
  push:
    tags:
      - "v*-poc"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dw2003-dual-screen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Test, lint, and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Prepare release artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/DW2003-Dual-Screen-${GITHUB_REF_NAME}-debug.apk
          sha256sum app/build/outputs/apk/debug/DW2003-Dual-Screen-${GITHUB_REF_NAME}-debug.apk \
            > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DW2003 Dual Screen ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            POC Android para SLES-03936 Europa y Flawe's Mod 2.0 combinado.

            El APK utiliza la firma de depuración de Android y está destinado a pruebas.
            No incluye ROM, BIOS ni parches del juego.
          files: |
            dw2003-dual-screen/app/build/outputs/apk/debug/DW2003-Dual-Screen-${{ github.ref_name }}-debug.apk
            dw2003-dual-screen/app/build/outputs/apk/debug/SHA256SUMS.txt

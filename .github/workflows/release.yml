name: Publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Decode release keystore
        env:
          DW2003_KEYSTORE_BASE64: ${{ secrets.DW2003_KEYSTORE_BASE64 }}
        run: |
          test -n "$DW2003_KEYSTORE_BASE64"
          echo "$DW2003_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dw2003-release.jks"

      - name: Test, lint, and build release
        env:
          DW2003_STORE_FILE: ${{ runner.temp }}/dw2003-release.jks
          DW2003_STORE_PASSWORD: ${{ secrets.DW2003_STORE_PASSWORD }}
          DW2003_KEY_ALIAS: ${{ secrets.DW2003_KEY_ALIAS }}
          DW2003_KEY_PASSWORD: ${{ secrets.DW2003_KEY_PASSWORD }}
        run: ./scripts/build.sh :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Prepare release artifact
        run: |
          apk="dw2003-dual-screen/app/build/outputs/apk/release/app-release.apk"
          dest="dw2003-dual-screen/app/build/outputs/apk/release/DW2003-Dual-Screen-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$dest"
          sha256sum "$dest" > dw2003-dual-screen/app/build/outputs/apk/release/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$dest" \
            > dw2003-dual-screen/app/build/outputs/apk/release/CERT.txt
          python3 scripts/release-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DW2003 Dual Screen ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dw2003-dual-screen/app/build/outputs/apk/release/DW2003-Dual-Screen-${{ github.ref_name }}.apk
            dw2003-dual-screen/app/build/outputs/apk/release/SHA256SUMS.txt
            dw2003-dual-screen/app/build/outputs/apk/release/CERT.txt

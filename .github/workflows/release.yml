name: Publish Android release

on:
  push:
    tags:
      - "v*-poc"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dw2003-dual-screen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Decode release keystore
        env:
          DW2003_KEYSTORE_BASE64: ${{ secrets.DW2003_KEYSTORE_BASE64 }}
        run: |
          test -n "$DW2003_KEYSTORE_BASE64"
          echo "$DW2003_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dw2003-release.jks"

      - name: Test, lint, and build release
        env:
          DW2003_STORE_FILE: ${{ runner.temp }}/dw2003-release.jks
          DW2003_STORE_PASSWORD: ${{ secrets.DW2003_STORE_PASSWORD }}
          DW2003_KEY_ALIAS: ${{ secrets.DW2003_KEY_ALIAS }}
          DW2003_KEY_PASSWORD: ${{ secrets.DW2003_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Prepare release artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/DW2003-Dual-Screen-${GITHUB_REF_NAME}.apk
          sha256sum app/build/outputs/apk/release/DW2003-Dual-Screen-${GITHUB_REF_NAME}.apk \
            > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DW2003 Dual Screen ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            POC Android para SLES-03936 Europa y Flawe's Mod 2.0 combinado.

            APK de release firmado (`com.digitaladventure.dw2003`). La primera vez hay que desinstalar la POC debug (`.debug`) e instalar este paquete; a partir de aquí el actualizador in-app puede reemplazar la app.
            No incluye ROM, BIOS ni parches del juego.
          files: |
            dw2003-dual-screen/app/build/outputs/apk/release/DW2003-Dual-Screen-${{ github.ref_name }}.apk
            dw2003-dual-screen/app/build/outputs/apk/release/SHA256SUMS.txt
